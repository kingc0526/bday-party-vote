<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>四小十岁 · 生日派对选址投票</title>
  <meta name="description" content="11/21 四位小寿星联合生日派对 · 广州 5 个候选场地投票">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/venues.css">
  <link rel="stylesheet" href="assets/css/vote.css">
</head>
<body>

  <!-- 顶部 Hero -->
  <header class="hero">
    <svg class="hero__confetti" aria-hidden="true" preserveAspectRatio="none" viewBox="0 0 400 300">
      <circle cx="30" cy="40" r="5" fill="#FF4D6D"/><circle cx="370" cy="60" r="4" fill="#FFB020"/>
      <rect x="340" y="20" width="8" height="8" rx="2" fill="#7C5CFF" transform="rotate(20 344 24)"/>
      <rect x="50" y="120" width="7" height="7" rx="2" fill="#2EC4B6" transform="rotate(-15 53 123)"/>
      <circle cx="90" cy="25" r="3.5" fill="#4D96FF"/><circle cx="310" cy="130" r="4" fill="#FF4D6D"/>
      <rect x="20" y="200" width="8" height="8" rx="2" fill="#FFB020" transform="rotate(30 24 204)"/>
      <circle cx="380" cy="190" r="4.5" fill="#2EC4B6"/><rect x="120" y="8" width="6" height="6" rx="2" fill="#7C5CFF" transform="rotate(45 123 11)"/>
      <circle cx="200" cy="14" r="3" fill="#FF8A00"/>
    </svg>
    <span class="hero__badge">🎂 11.21 · 周六 · 广州</span>
    <h1 class="hero__title">四小<em>十岁</em>啦！<br>生日派对去哪办？</h1>
    <p class="hero__sub">同一间产房出来的四位小公主，第 10 年一起过生日</p>
    <div class="hero__meta">
      <span class="chip">👧 ×4 小寿星</span>
      <span class="chip">🏙️ 广州 + 清远亲友团</span>
      <span class="chip">🍰 有吃有玩能聊天</span>
    </div>
  </header>

  <main class="wrap">

    <!-- 投票说明 -->
    <p style="text-align:center;color:var(--c-ink-soft);font-size:14px;margin-top:4px;">
      看完 5 个方案，<strong style="color:var(--c-primary);">点卡片上的「投这票」</strong>选出你的心头好 👇
    </p>

    <!-- 方案卡片区（render-venues.js 渲染） -->
    <div class="section-head">
      <span class="section-head__no">STEP 1</span>
      <h2 class="section-head__title">五个候选方案</h2>
      <span class="section-head__hint">按风格排序</span>
    </div>
    <section id="venue-list" aria-label="候选场地列表">
      <noscript>需要开启 JavaScript 查看候选方案。</noscript>
    </section>

    <!-- 投票结果区（vote.js 渲染） -->
    <div class="section-head">
      <span class="section-head__no">STEP 2</span>
      <h2 class="section-head__title">实时战况</h2>
      <span class="section-head__hint">本机演示</span>
    </div>
    <section id="results" aria-label="投票结果"></section>

  </main>

  <!-- 底部操作栏（vote.js 控制） -->
  <div id="dock" class="dock" role="region" aria-label="投票操作栏"></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 页脚说明 -->
  <footer class="footer">
    <div class="wrap" style="padding:0;">
      <strong>📋 信息说明</strong><br>
      · 场地信息来自 2026-11 公开渠道（官网/大众点评/携程等），价格供预算参考，<strong>生日派对套餐均需电话或门店询价确认</strong>。<br>
      · 投票结果保存在各自手机本地，正式计票以群里接龙为准。<br>
      · 有想补充的场地？直接告诉 KingC 加上去 🎈
    </div>
  </footer>

  <script src="assets/js/venues-data.js"></script>
  <script src="assets/js/render-venues.js"></script>
  <script src="assets/js/vote.js"></script>
</body>
</html>
